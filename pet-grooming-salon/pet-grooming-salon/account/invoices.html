<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices — PawVille</title>
  <meta name="description" content="View and download your PawVille grooming invoices.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="Invoices — PawVille">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css?v=20260814h" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <header id="admin-topbar"></header>

      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 mb-1">Invoices 🧾</h1>
            <p class="text-secondary mb-0">Invoices are generated once a groom is completed.</p>
          </div>
        </div>

        <div class="clay p-4 reveal">
          <div class="table-responsive">
            <table class="table table-clay align-middle">
              <thead>
                <tr><th>Pet</th><th>Package</th><th>Amount</th><th>Date</th><th>Status</th><th class="text-end"></th></tr>
              </thead>
              <tbody id="invoices-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ======= Invoice modal ======= -->
  <div class="modal fade" id="invoiceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="background:var(--pv-bg);border:none;border-radius:26px;box-shadow:var(--clay-raised-lg)">
        <div class="modal-header border-0 align-items-center">
          <h2 class="modal-title h5 mb-0">Invoice preview</h2>
          <div class="d-flex gap-2">
            <button class="btn-clay btn-sm" id="invoice-print" type="button">🖨️ Download / Print</button>
            <button type="button" class="btn-clay-outline btn-sm" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
        <div class="modal-body">
          <div class="invoice-sheet p-4 p-md-5" id="invoice-fill">
            <!-- filled by invoice.js -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260814h"></script>
  <script src="../assets/js/invoice.js?v=20260814h"></script>
  <script src="account.js?v=20260814h"></script>
</body>
</html>
