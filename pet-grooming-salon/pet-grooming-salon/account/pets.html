<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pets — PawVille</title>
  <meta name="description" content="Manage your pets' profiles at PawVille.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="My Pets — PawVille">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css?v=20260814h" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <header id="admin-topbar"></header>

      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 mb-1">My pets 🐾</h1>
            <p class="text-secondary mb-0">Keep a profile for each pet to make booking faster.</p>
          </div>
        </div>

        <div class="row g-4 justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="row g-4" id="pets-grid">
              <!-- filled by account.js -->
            </div>

            <div class="row g-4 justify-content-center mt-0">
              <div class="col-12 col-xl-8">
                <div class="clay p-4 reveal">
                  <h2 class="h5 mb-3">Add a pet</h2>
                  <form id="pet-form">
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label" for="pt-name">Pet name</label>
                        <input type="text" id="pt-name" name="petName" class="form-control form-clay" placeholder="e.g. Bella" required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="pt-species">Species</label>
                        <select id="pt-species" name="species" class="form-select form-clay">
                          <option value="dog">Dog</option>
                          <option value="cat">Cat</option>
                          <option value="rabbit">Rabbit</option>
                          <option value="bird">Bird</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="pt-breed">Breed</label>
                        <input type="text" id="pt-breed" name="breed" class="form-control form-clay" placeholder="e.g. Golden Retriever" required>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label" for="pt-age">Age</label>
                        <input type="text" id="pt-age" name="age" class="form-control form-clay" placeholder="e.g. 3 years">
                      </div>
                      <div class="col-12">
                        <label class="form-label" for="pt-notes">Notes</label>
                        <textarea id="pt-notes" name="notes" class="form-control form-clay" rows="3" placeholder="Allergies, temperaments, favourite treats…"></textarea>
                      </div>
                      <div class="col-12">
                        <button class="btn-clay w-100" type="submit">Add Pet</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260814h"></script>
  <script src="account.js?v=20260814h"></script>
</body>
</html>
