<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — PawVille Pet Grooming &amp; Care Salon</title>
  <meta name="description" content="Create a free PawVille account to book grooming, manage appointments and download invoices.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="Register — PawVille">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=20260814h" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

  <div class="auth-actions d-flex gap-2">
    <button class="nav-icon-btn" type="button" id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle theme">
      <span class="icon-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="icon-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
    </button>
    <button class="nav-icon-btn" type="button" id="dir-toggle" title="Toggle RTL / LTR layout" aria-label="Toggle direction">
      <span id="dir-label" class="fw-bold" style="font-size:.9rem">RTL</span>
    </button>
  </div>

  <main>
    <section class="auth-wrap">
      <span class="blob" style="position:absolute;width:340px;height:340px;top:-120px;inset-inline-start:-100px;background:radial-gradient(circle at 30% 30%,rgba(217,160,94,.5),transparent 70%)"></span>
      <span class="blob" style="position:absolute;width:300px;height:300px;bottom:-120px;inset-inline-end:-90px;background:radial-gradient(circle at 60% 40%,rgba(139,124,246,.4),transparent 70%)"></span>

      <div class="auth-card clay-lg p-4 p-sm-5 reveal">
        <div class="text-center mb-4">
          <a class="navbar-brand justify-content-center mb-3" href="index.html">
            <img src="assets/images/logo.png" alt="PawVille logo">
            <span>PawVille</span>
          </a>
          <h1 class="h3 mb-1">Create your account 🎉</h1>
          <p class="text-secondary mb-0">Book grooms, track history &amp; download invoices.</p>
        </div>

        <form data-auth="register">
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="reg-first">First name</label>
              <input type="text" id="reg-first" name="first" class="form-control form-clay" placeholder="Jane" required>
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="reg-last">Last name</label>
              <input type="text" id="reg-last" name="last" class="form-control form-clay" placeholder="Doe" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="reg-email">Email address</label>
              <input type="email" id="reg-email" name="email" class="form-control form-clay" placeholder="you@email.com" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="reg-pass">Password</label>
              <input type="password" id="reg-pass" name="pass" class="form-control form-clay" placeholder="At least 8 characters" minlength="8" required>
            </div>
            <div class="col-12">
              <div class="clay-inset p-3">
                <div class="fw-bold mb-2" style="font-size:.95rem">What pets will you bring? 🐶🐱</div>
                <div class="d-flex flex-wrap gap-3">
                  <div class="form-check"><input class="form-check-input" type="checkbox" id="pet-dog"><label class="form-check-label" for="pet-dog">Dog</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" id="pet-cat"><label class="form-check-label" for="pet-cat">Cat</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" id="pet-small"><label class="form-check-label" for="pet-small">Small pet</label></div>
                </div>
              </div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms" required>
                <label class="form-check-label text-secondary" for="terms" style="font-size:.9rem">I agree to the <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a></label>
              </div>
            </div>
            <div class="col-12">
              <button class="btn-clay w-100 btn-lg" type="submit">Create Account</button>
            </div>
          </div>
        </form>

        <div class="text-center my-4">
          <span class="text-secondary" style="font-size:.85rem">— or sign up with —</span>
        </div>
        <div class="d-flex flex-column gap-3">
          <a href="#" class="social-btn">🔵 Continue with Google</a>
          <a href="#" class="social-btn">📘 Continue with Facebook</a>
        </div>

        <p class="text-center text-secondary mt-4 mb-0" style="font-size:.95rem">
          Already have an account? <a href="login.html" class="fw-bold">Log in</a>
        </p>
        <p class="text-center mt-3 mb-0">
          <a href="admin-register.html" class="text-secondary" style="font-size:.85rem">🔐 Are you a PawVille team member? Create an admin account</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js?v=20260814h"></script>
</body>
</html>
