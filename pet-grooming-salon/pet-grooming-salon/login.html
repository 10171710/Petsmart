<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PawVille Pet Grooming &amp; Care Salon</title>
  <meta name="description" content="Log in to your PawVille account to manage appointments, history and invoices.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="Login — PawVille">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=20260814h" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

  <div class="auth-actions d-flex gap-2">
    <button class="nav-icon-btn" type="button" id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle theme">
      <span class="icon-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="icon-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
    </button>
    <button class="nav-icon-btn" type="button" id="dir-toggle" title="Toggle RTL / LTR layout" aria-label="Toggle direction">
      <span id="dir-label" class="fw-bold" style="font-size:.9rem">RTL</span>
    </button>
  </div>

  <main>
    <section class="auth-wrap">
      <span class="blob" style="position:absolute;width:340px;height:340px;top:-120px;inset-inline-start:-100px;background:radial-gradient(circle at 30% 30%,rgba(217,160,94,.5),transparent 70%)"></span>
      <span class="blob" style="position:absolute;width:300px;height:300px;bottom:-120px;inset-inline-end:-90px;background:radial-gradient(circle at 60% 40%,rgba(46,198,189,.45),transparent 70%)"></span>

      <div class="auth-card clay-lg p-4 p-sm-5 reveal">
        <div class="text-center mb-4">
          <a class="navbar-brand justify-content-center mb-3" href="index.html">
            <img src="assets/images/logo.png" alt="PawVille logo">
            <span>PawVille</span>
          </a>
          <h1 class="h3 mb-1" id="login-title">Customer login 🐾</h1>
          <p class="text-secondary mb-0" id="login-sub">Log in to manage your pet's appointments.</p>
        </div>

        <form data-auth="login">
          <input type="hidden" name="role" value="user">
          <div class="mb-3">
            <label class="form-label" for="login-email">Email address</label>
            <input type="email" id="login-email" name="email" class="form-control form-clay" placeholder="you@email.com" required>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="login-pass">Password</label>
              <a href="#" class="text-secondary" style="font-size:.85rem" id="forgot-link">Forgot password?</a>
            </div>
            <input type="password" id="login-pass" name="pass" class="form-control form-clay" placeholder="••••••••" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember" checked>
            <label class="form-check-label text-secondary" for="remember">Keep me signed in</label>
          </div>
          <button class="btn-clay w-100 btn-lg" type="submit">Login</button>
        </form>

        <div class="text-center my-4">
          <span class="text-secondary" style="font-size:.85rem">— or continue with —</span>
        </div>
        <div class="d-flex flex-column gap-3">
          <a href="https://accounts.google.com/" target="_blank" rel="noopener" class="social-btn">🔵 Continue with Google</a>
          <a href="https://www.facebook.com/login/" target="_blank" rel="noopener" class="social-btn">📘 Continue with Facebook</a>
        </div>

        <p class="text-center text-secondary mt-4 mb-0" style="font-size:.95rem">
          New to PawVille? <a href="register.html" class="fw-bold">Create an account</a>
        </p>
        <p class="text-center mt-3 mb-0">
          <a href="admin-login.html" class="text-secondary" style="font-size:.85rem">🔐 Are you staff? Go to admin login</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js?v=20260814h"></script>
  <script>
    (function () {
      var forgot = document.getElementById("forgot-link");
      if (forgot) {
        forgot.addEventListener("click", function (e) {
          e.preventDefault();
          PawPopup({
            icon: "🔑",
            title: "Password reset",
            message: "A reset link is on its way to your inbox — check your email and follow the steps."
          });
        });
      }
    })();
  </script>
</body>
</html>
