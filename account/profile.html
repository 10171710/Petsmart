<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — PawVille</title>
  <meta name="description" content="Manage your PawVille account profile and password.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="Profile — PawVille">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="bs-core-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="../assets/css/style.css?v=20260917" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <header id="admin-topbar"></header>

      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 mb-1">Profile <i class="fa-solid fa-user"></i></h1>
            <p class="text-secondary mb-0">Update your personal details and password.</p>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="clay p-4 reveal">
              <h2 class="h5 mb-3">Personal details</h2>
              <form id="profile-form">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label class="form-label" for="prof-first">First name</label>
                    <input type="text" id="prof-first" name="first" class="form-control form-clay" placeholder="First name" required>
                  </div>
                  <div class="col-sm-6">
                    <label class="form-label" for="prof-last">Last name</label>
                    <input type="text" id="prof-last" name="last" class="form-control form-clay" placeholder="Last name" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="prof-email">Email address</label>
                    <input type="email" id="prof-email" name="email" class="form-control form-clay" placeholder="you@email.com" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="prof-phone">Phone</label>
                    <input type="tel" id="prof-phone" name="phone" class="form-control form-clay" placeholder="+1 (555) 000-0000">
                  </div>
                  <div class="col-12">
                    <button class="btn-clay" type="submit">Save Changes</button>
                  </div>
                </div>
              </form>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="clay p-4 mb-4 reveal">
              <h2 class="h5 mb-3">Change password</h2>
              <form id="pass-form">
                <div class="mb-3">
                  <label class="form-label" for="pass-new">New password</label>
                  <input type="password" id="pass-new" name="pass" class="form-control form-clay" placeholder="At least 8 characters" minlength="8" required>
                </div>
                <div class="mb-3">
                  <label class="form-label" for="pass-confirm">Confirm password</label>
                  <input type="password" id="pass-confirm" name="confirm" class="form-control form-clay" placeholder="Repeat new password" minlength="8" required>
                </div>
                <button class="btn-clay w-100" type="submit">Update Password</button>
              </form>
            </div>

            <div class="clay p-4 reveal">
              <h2 class="h5 mb-3">Account actions</h2>
              <button class="btn-clay-outline w-100 text-danger" type="button" data-logout><i class="fa-solid fa-right-from-bracket"></i> Log out of PawVille</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260910k"></script>
  <script src="account.js?v=20260910k"></script>
</body>
</html>
