<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — PawVille Pet Grooming &amp; Care Salon</title>
  <meta name="description" content="Log in to your PawVille account to manage appointments, history and invoices.">
  <meta name="author" content="PawVille">
  <meta property="og:title" content="Login — PawVille">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="assets/css/style.css?v=20260910k" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

  <div class="auth-actions d-flex gap-2">
    <button class="nav-icon-btn" type="button" id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle theme">
      <span class="icon-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span class="icon-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
    </button>
    <button class="nav-icon-btn" type="button" id="dir-toggle" title="Toggle RTL / LTR layout" aria-label="Toggle direction">
      <span id="dir-label" class="fw-bold" style="font-size:.9rem">RTL</span>
    </button>
  </div>

  <main>
    <section class="auth-wrap">
      <span class="blob" style="position:absolute;width:340px;height:340px;top:-120px;inset-inline-start:-100px;background:radial-gradient(circle at 30% 30%,rgba(169,103,55,.5),transparent 70%)"></span>
      <span class="blob" style="position:absolute;width:300px;height:300px;bottom:-120px;inset-inline-end:-90px;background:radial-gradient(circle at 60% 40%,rgba(46,198,189,.45),transparent 70%)"></span>

      <div class="auth-card clay-lg p-4 p-sm-5 reveal">
        <div class="text-center mb-4">
          <a class="navbar-brand justify-content-center mb-3" href="index.html">
            <img src="assets/images/logo.png" alt="PawVille logo">
            <span>PawVille</span>
          </a>
          <h1 class="h3 mb-1" id="login-title">Customer login <i class="fa-solid fa-paw"></i></h1>
          <p class="text-secondary mb-0" id="login-sub">Log in to manage your pet's appointments.</p>
        </div>

        <form data-auth="login">
          <input type="hidden" name="role" value="user">
          <div class="mb-3">
            <label class="form-label" for="login-email">Email address</label>
            <input type="email" id="login-email" name="email" class="form-control form-clay" placeholder="you@email.com" required>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="login-pass">Password</label>
              <a href="#" class="text-secondary" style="font-size:.85rem" id="forgot-link">Forgot password?</a>
            </div>
            <input type="password" id="login-pass" name="pass" class="form-control form-clay" placeholder="••••••••" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label text-secondary" for="remember">Keep me signed in</label>
          </div>
          <div class="d-flex flex-column gap-2 mt-3">
            <button class="btn-clay w-100 btn-lg" type="submit">Login</button>
            <a href="dashboard.html" class="btn-clay-outline w-100 justify-content-center" id="quick-demo-btn"><i class="fa-solid fa-chart-line me-1"></i> Access Demo Dashboard</a>
          </div>
        </form>

        <div class="text-center my-4">
          <span class="text-secondary" style="font-size:.85rem">— or continue with —</span>
        </div>
        <div class="d-flex flex-column gap-3">
          <a href="https://accounts.google.com/" target="_blank" rel="noopener" class="social-btn social-btn-google"><svg class="sicon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47a5.53 5.53 0 0 1-2.4 3.63v3.03h3.86c2.26-2.09 3.56-5.17 3.56-8.9z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3.03c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.12C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.26a7.22 7.22 0 0 1 0-4.52V6.62H1.29a12.01 12.01 0 0 0 0 10.76l3.98-3.12z"/><path fill="#EA4335" d="M12 4.78c1.76 0 3.35.6 4.6 1.79l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.12C6.22 6.89 8.87 4.78 12 4.78z"/></svg> Continue with Google</a>
          <a href="https://www.facebook.com/login/" target="_blank" rel="noopener" class="social-btn social-btn-facebook"><svg class="sicon" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.89v2.26h3.32l-.53 3.49h-2.8V24C19.62 23.09 24 18.1 24 12.07z"/></svg> Continue with Facebook</a>
          <a href="https://appleid.apple.com/" target="_blank" rel="noopener" class="social-btn social-btn-apple"><svg class="sicon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.36 12.76c0-2.56 2.09-3.79 2.19-3.85-1.19-1.75-3.05-1.99-3.71-2.02-1.58-.16-3.08.93-3.88.93-.8 0-2.04-.91-3.35-.88-1.72.03-3.31 1-4.2 2.54-1.79 3.11-.46 7.72 1.29 10.25.85 1.24 1.86 2.63 3.19 2.58 1.28-.05 1.76-.83 3.31-.83s1.98.83 3.33.8c1.39-.02 2.27-1.26 3.11-2.5.98-1.43 1.38-2.82 1.4-2.89-.03-.01-2.68-1.03-2.71-4.1zM13.76 5.44c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.26.68-2.99 1.54-.66.76-1.23 1.98-1.08 3.15 1.13.09 2.29-.58 3.01-1.44z"/></svg> Continue with Apple</a>
        </div>

        <p class="text-center text-secondary mt-4 mb-0" style="font-size:.95rem">
          New to PawVille? <a href="register.html" class="fw-bold">Create an account</a>
        </p>
        <p class="text-center mt-3 mb-0">
          <a href="admin-login.html" class="text-secondary" style="font-size:.85rem"><i class="fa-solid fa-lock"></i> Staff member? Admin login</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js?v=20260910k"></script>
  <script>
    (function () {
      var forgot = document.getElementById("forgot-link");
      if (forgot) {
        forgot.addEventListener("click", function (e) {
          e.preventDefault();
          PawPopup({
            icon: '<i class="fa-solid fa-key"></i>',
            title: "Password reset",
            message: "A reset link is on its way to your inbox — check your email and follow the steps. (Demo account: demo@pawville.com)"
          });
        });
      }
    })();
  </script>
</body>
</html>
