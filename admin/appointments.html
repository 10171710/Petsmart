<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Appointments — PawVille Admin</title>
  <meta name="description" content="Manage all PawVille appointments, confirmations and order statuses.">
  <meta name="author" content="PawVille">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="../assets/css/style.css?v=20260910k" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <header id="admin-topbar"></header>

      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h1 class="h3 mb-1">Appointments &amp; Orders</h1>
            <p class="text-secondary mb-0">Confirm, complete or cancel bookings — changes save instantly.</p>
          </div>
          <div class="d-flex gap-2">
            <select class="form-select form-clay" id="status-filter" style="width:auto">
              <option value="all">All statuses</option>
              <option value="pending">Pending</option>
              <option value="confirmed">Confirmed</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
        </div>

        <!-- Stat strip -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="clay stat-tile reveal"><div class="st-icon" style="color:var(--pv-accent-deep)"><i class="fa-solid fa-clock"></i></div><div><div class="st-value" id="stat-pending">0</div><div class="st-label">Pending</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="clay stat-tile reveal" style="transition-delay:.05s"><div class="st-icon" style="color:var(--pv-secondary)"><i class="fa-solid fa-circle-check"></i></div><div><div class="st-value" id="stat-confirmed">0</div><div class="st-label">Confirmed</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="clay stat-tile reveal" style="transition-delay:.1s"><div class="st-icon" style="color:var(--pv-violet)"><i class="fa-solid fa-clipboard-check"></i></div><div><div class="st-value" id="stat-completed">0</div><div class="st-label">Completed</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="clay stat-tile reveal" style="transition-delay:.15s"><div class="st-icon" style="color:var(--pv-muted)"><i class="fa-solid fa-circle-xmark"></i></div><div><div class="st-value" id="stat-cancelled">0</div><div class="st-label">Cancelled</div></div></div></div>
        </div>

        <div class="clay p-3 p-md-4 reveal">
          <div class="table-responsive">
            <table class="table table-clay align-middle">
              <thead>
                <tr><th>Pet</th><th>Client</th><th>Package</th><th>Date / time</th><th>Groomer</th><th>Status</th><th class="text-end">Actions</th></tr>
              </thead>
              <tbody id="upcoming-body"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260910k"></script>
  <script src="../assets/js/invoice.js?v=20260910k"></script>
  <script src="../assets/js/admin.js?v=20260910k"></script>
  <script>
    (function () {
      function countStats() {
        var rows = document.querySelectorAll("#upcoming-body tr[data-id]");
        var stats = { pending: 0, confirmed: 0, completed: 0, cancelled: 0 };
        rows.forEach(function (tr) {
          var b = tr.querySelector(".badge-clay");
          var t = b ? b.textContent.toLowerCase() : "";
          if (stats.hasOwnProperty(t)) stats[t]++;
        });
        document.getElementById("stat-pending").textContent = stats.pending;
        document.getElementById("stat-confirmed").textContent = stats.confirmed;
        document.getElementById("stat-completed").textContent = stats.completed;
        document.getElementById("stat-cancelled").textContent = stats.cancelled;
      }
      // Re-count after admin.js renders (admin.js calls renderAppointments synchronously in init)
      window.addEventListener("load", countStats);
      setTimeout(countStats, 50);
    })();
  </script>
</body>
</html>
