<!DOCTYPE html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pets — PawVille Admin</title>
  <meta name="description" content="Every pet registered at PawVille — breeds, owners and visit history.">
  <meta name="author" content="PawVille">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link id="bs-core-css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link href="../assets/css/style.css?v=20260917" rel="stylesheet">
  <link rel="icon" type="image/png" href="../assets/images/logo.png">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside id="admin-sidebar"></aside>

    <div class="admin-main">
      <header id="admin-topbar"></header>

      <div class="admin-content">

        <!-- ======= Page head ======= -->
        <section class="welcome-hero">
          <div>
            <span class="eyebrow">PET REGISTRY</span>
            <h1 class="dash-hero-title">All registered pets</h1>
            <p class="text-secondary mb-0" style="max-width:560px">Every client's furry (and feathery) friend on file — add new pets or remove records.</p>
          </div>
          <div class="welcome-hero-actions">
            <button class="btn-clay" type="button" data-bs-toggle="offcanvas" data-bs-target="#petFormCanvas"><i class="fa-solid fa-paw"></i> Register Pet</button>
            <a class="btn-clay-outline" href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
          </div>
        </section>

        <!-- ======= Stat strip ======= -->
        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3">
            <div class="clay metric-card reveal">
              <div class="metric-ico amber"><i class="fa-solid fa-paw"></i></div>
              <div><div class="metric-value" id="pet-stat-total">0</div><div class="metric-label">Pets on file</div></div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="clay metric-card reveal" style="transition-delay:.05s">
              <div class="metric-ico brown"><i class="fa-solid fa-dog"></i></div>
              <div><div class="metric-value" id="pet-stat-dogs">0</div><div class="metric-label">Dogs</div></div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="clay metric-card reveal" style="transition-delay:.1s">
              <div class="metric-ico teal"><i class="fa-solid fa-cat"></i></div>
              <div><div class="metric-value" id="pet-stat-cats">0</div><div class="metric-label">Cats</div></div>
            </div>
          </div>
          <div class="col-6 col-xl-3">
            <div class="clay metric-card reveal" style="transition-delay:.15s">
              <div class="metric-ico violet"><i class="fa-solid fa-rotate"></i></div>
              <div><div class="metric-value" id="pet-stat-visits">0</div><div class="metric-label">Visits logged</div></div>
            </div>
          </div>
        </div>

        <!-- ======= Pets grid ======= -->
        <section class="clay panel reveal">
          <div class="panel-head">
            <div>
              <h2 class="panel-title">Pet directory</h2>
              <div class="panel-sub">Click the bin icon to remove a record</div>
            </div>
          </div>
          <div class="row g-3" id="pets-grid"></div>
        </section>

      </div>
    </div>
  </div>

  <!-- ======= Register pet offcanvas ======= -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="petFormCanvas" style="width:min(420px,92vw);background:var(--pv-bg)">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title h5">Register a new pet</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <form id="pet-form" class="booking-form mini-form">
        <div class="mb-3">
          <label class="form-label" for="p-pet">Pet type</label>
          <select id="p-pet" name="species" class="form-select form-clay">
            <option value="dog">Dog</option>
            <option value="cat">Cat</option>
            <option value="rabbit">Rabbit</option>
            <option value="bird">Bird</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="p-name">Pet name</label>
          <input type="text" id="p-name" name="petName" class="form-control form-clay" placeholder="e.g. Bella" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="p-breed">Breed</label>
          <input type="text" id="p-breed" name="breed" class="form-control form-clay" placeholder="e.g. Golden Retriever" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="p-age">Age</label>
          <input type="text" id="p-age" name="age" class="form-control form-clay" placeholder="e.g. 3 years">
        </div>
        <div class="mb-3">
          <label class="form-label" for="p-email">Owner email</label>
          <input type="email" id="p-email" name="email" class="form-control form-clay" placeholder="owner@email.com">
        </div>
        <div class="mb-3">
          <label class="form-label" for="p-notes">Notes / allergies</label>
          <textarea id="p-notes" name="notes" class="form-control form-clay" rows="3" placeholder="Sensitive skin, etc."></textarea>
        </div>
        <button class="btn-clay w-100" type="submit"><i class="fa-solid fa-paw"></i> Register pet</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js?v=20260917"></script>
  <script src="../assets/js/invoice.js?v=20260917"></script>
  <script src="../assets/js/admin.js?v=20260917"></script>
</body>
</html>
